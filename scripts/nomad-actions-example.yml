# Example: copy to .github/workflows/nomad-resume.yml and customize.
# Reads .claw/nomad_snapshot.json from the repo after an auto-push from your machine.
name: nomad-resume
on:
  workflow_dispatch:
  push:
    paths:
      - ".claw/nomad_snapshot.json"

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show snapshot (no secrets)
        run: |
          if [ -f .claw/nomad_snapshot.json ]; then
            cat .claw/nomad_snapshot.json | head -c 8000
          else
            echo "No snapshot"
          fi
      - name: Placeholder — e.g. dry-run DevClaw (needs secrets in repo Settings)
        run: |
          echo "Optional: pip install -r dev_claw/requirements.txt && py dev_claw/main.py --max-iters 1 'read nomad_snapshot and summarize'"
          echo "Do NOT commit API keys; use GitHub Encrypted secrets + env in workflow."
